name: Build Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the generated package as a GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Checkout private game assemblies
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GAME_ASSEMBLIES_REPOSITORY || 'adofaiex/ADOFAI.GameAssemblies' }}
          ref: ${{ vars.GAME_ASSEMBLIES_REF || 'game-assemblies-2026.09.27' }}
          token: ${{ secrets.GAME_ASSEMBLIES_READ_TOKEN }}
          path: .game-assemblies

      - name: Checkout previous game assemblies (API diff)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GAME_ASSEMBLIES_REPOSITORY || 'adofaiex/ADOFAI.GameAssemblies' }}
          ref: game-assemblies-2026.09.06.2
          token: ${{ secrets.GAME_ASSEMBLIES_READ_TOKEN }}
          path: .game-assemblies-prev

      - name: Prepare compile assemblies
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\.game-assemblies\Prepare-CompileAssemblies.ps1
          -SourceDirectory .\.game-assemblies
          -DestinationDirectory .\.compile-assemblies

      - name: Prepare previous compile assemblies
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\.game-assemblies-prev\Prepare-CompileAssemblies.ps1
          -SourceDirectory .\.game-assemblies-prev
          -DestinationDirectory .\.compile-assemblies-prev

      - name: Dump touched game API surface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\api-dump | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\DumpTouchedGameApi.ps1 `
            -AssembliesDirectory .\.compile-assemblies `
            -OutputPath .\api-dump\new-Assembly-CSharp.txt `
            -Label game-assemblies-2026.09.27
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\DumpTouchedGameApi.ps1 `
            -AssembliesDirectory .\.compile-assemblies-prev `
            -OutputPath .\api-dump\old-Assembly-CSharp.txt `
            -Label game-assemblies-2026.09.06.2
          git diff --no-index --text -- .\api-dump\old-Assembly-CSharp.txt .\api-dump\new-Assembly-CSharp.txt > .\api-dump\touched-api.diff || true

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-api-dump
          path: api-dump/*
          if-no-files-found: warn

      - name: Build release package
        shell: pwsh
        run: >-
          dotnet build .\ADOFAI.EditorTweaks.csproj
          -c Release
          /p:CreateModPackage=true
          /p:BumpModVersion=false
          /p:ManagedAssembliesDir="$env:GITHUB_WORKSPACE\.compile-assemblies"
          /p:UseGameMscorlib=false
          /p:RequireGameExecutable=false
          /p:EnableModDeployment=false

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ADOFAI.EditorTweaks-release
          path: Build/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $info = Get-Content -LiteralPath .\Info.json -Raw | ConvertFrom-Json
          $package = Get-ChildItem -LiteralPath .\Build -File -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $package) {
              throw 'No release package was found.'
          }
          gh release create $info.Version $package.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$($info.DisplayName) $($info.Version)" --generate-notes
