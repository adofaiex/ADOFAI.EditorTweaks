name: Build and publish release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本标签，例如 1.2.7 或 v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Restore shared build references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'lib')) {
            git fetch origin main --depth=1
            git checkout origin/main -- lib
          }
          if (-not (Test-Path -LiteralPath 'lib\Assembly-CSharp.dll')) {
            throw 'The lib reference library is missing Assembly-CSharp.dll.'
          }

      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^(v)?\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag"
          }

          $version = $tag -replace '^v', ''
          $info = Get-Content -LiteralPath 'Info.json' -Raw | ConvertFrom-Json
          if ([string]$info.Version -ne $version) {
            throw "Tag $tag expects Info.json version $version, but found $($info.Version)."
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet build 'ADOFAI.EditorTweaks.csproj' `
            --configuration Release `
            /p:CreateModPackage=true `
            /p:BumpModVersion=false `
            /p:AutoLaunchGame=false `
            "/p:GameExePath=" `
            "/p:ManagedAssembliesDir=$env:GITHUB_WORKSPACE\lib" `
            --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $package = Join-Path $env:GITHUB_WORKSPACE "Build\ADOFAI.EditorTweaks-$env:RELEASE_VERSION.zip"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Build package not found: $package"
          }
          "PACKAGE_PATH=$package" >> $env:GITHUB_ENV

      - name: Extract release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
          $pattern = "(?ms)^##\s+v?$escapedVersion(?:\s*-\s*[^\r\n]*)?\s*\r?\n.*?(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$env:RELEASE_VERSION.md"
          if ($match.Success) {
            $match.Value.Trim() | Set-Content -LiteralPath $notesPath -Encoding UTF8
          } else {
            "Automated build for $env:RELEASE_TAG." | Set-Content -LiteralPath $notesPath -Encoding UTF8
          }
          "NOTES_PATH=$notesPath" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $env:RELEASE_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:PACKAGE_PATH --repo $repo --clobber
          } else {
            $latest = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { '--latest=false' } else { '--latest=true' }
            gh release create $env:RELEASE_TAG $env:PACKAGE_PATH `
              --repo $repo `
              --title "ADOFAI Editor Tweaks $env:RELEASE_TAG" `
              --notes-file $env:NOTES_PATH `
              --verify-tag `
              $latest
          }
