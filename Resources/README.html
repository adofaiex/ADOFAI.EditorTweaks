<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>ADOFAI.EditorTweaks 使用手册</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 24px;line-height:1.7;background:#10151d;color:#e9eef5}h1,h2{color:#72e0bd}.card{border:1px solid #334354;padding:18px;margin:16px 0;border-radius:8px}</style></head><body>
<h1>ADOFAI.EditorTweaks</h1><p>编辑器与普通游戏运行时优化 Mod。</p>
<div class="card"><h2>UMM 设置</h2><ul><li>数值拖动：右键拖动支持的数字输入框。</li><li>装饰拖动和轴心：修复 Camera / CameraAspect 装饰编辑。</li><li>吸附步长：设为 0 可关闭移动吸附。</li><li>视频背景同步：只影响普通游戏播放。</li><li>编辑器偏好即时保存和缺图错误去重。</li></ul></div>
<div class="card"><h2>范围</h2><p>谱面视频渲染请安装独立的 ChartRendering Mod；压缩包处理请安装独立的 BetterZip Mod。</p></div>
</body></html>
